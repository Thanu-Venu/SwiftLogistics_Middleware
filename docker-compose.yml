services:
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    ports:
      - "5672:5672"
      - "15672:15672"
    restart: always

  postgres:
    image: postgres:15
    container_name: postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-admin}
      POSTGRES_DB: ${POSTGRES_DB:-logistics}
    ports:
      - "5432:5432"
    restart: always
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./services/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

  cms-soap-mock:
    build: ./services/cms-soap-mock
    container_name: cms-soap
    ports:
      - "9000:9000"
    restart: always

  ros-rest-mock:
    build: ./services/ros-rest-mock
    container_name: ros-rest
    ports:
      - "9100:9100"
    restart: always

  wms-tcp-mock:
    build: ./services/wms-tcp-mock
    container_name: wms-tcp
    ports:
      - "9200:9200"
      - "9201:9201"
    restart: always

  api-gateway:
    build: ./services/api-gateway
    container_name: api-gateway
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-admin}:${POSTGRES_PASSWORD:-admin}@postgres:5432/${POSTGRES_DB:-logistics}
      RABBIT_URL: amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASSWORD:-guest}@rabbitmq:5672/
      CMS_URL: http://cms-soap:9000/soap
      ROS_URL: http://ros-rest:9100/optimize-route
      WMS_HOST: wms-tcp
      WMS_PORT: "9200"

      SECRET_KEY: ${SECRET_KEY:-dev-secret-change-me}
      ALGORITHM: "HS256"
      ACCESS_TOKEN_EXPIRE_MINUTES: "60"

      CMS_INTERNAL: "http://cms-soap:9000"
      WMS_INTERNAL: "http://wms-tcp:9201"
      ROS_INTERNAL: "http://ros-rest:9100"

      CORS_ORIGIN_REGEX: ${CORS_ORIGIN_REGEX:-^http://(localhost|127\.0\.0\.1):5173$}

    depends_on:
      - rabbitmq
      - postgres
      - cms-soap-mock
      - ros-rest-mock
      - wms-tcp-mock
    restart: always

  worker:
    build: ./services/worker
    container_name: worker
    command: ["python", "worker.py", "consume"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-admin}:${POSTGRES_PASSWORD:-admin}@postgres:5432/${POSTGRES_DB:-logistics}
      RABBIT_URL: amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASSWORD:-guest}@rabbitmq:5672/
      CMS_URL: http://cms-soap:9000/soap
      ROS_URL: http://ros-rest:9100/optimize-route
      WMS_HOST: wms-tcp
      WMS_PORT: "9200"
      MAX_RETRIES: "5"
      RETRY_TTL_MS: "5000"
      DEMO_DELAYS: "true"
      PYTHONUNBUFFERED: "1"
    depends_on:
      - rabbitmq
      - postgres
      - cms-soap-mock
      - ros-rest-mock
      - wms-tcp-mock
    restart: always

  outbox_publisher:
    build: ./services/worker
    container_name: outbox-publisher
    command: ["python", "worker.py", "outbox"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-admin}:${POSTGRES_PASSWORD:-admin}@postgres:5432/${POSTGRES_DB:-logistics}
      RABBIT_URL: amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASSWORD:-guest}@rabbitmq:5672/
      MAX_RETRIES: "5"
      RETRY_TTL_MS: "5000"
      PYTHONUNBUFFERED: "1"
    depends_on:
      - rabbitmq
      - postgres
    restart: always

  client-portal:
    build:
      context: ./ui/client-portal
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0", "--port", "5173"]
    ports:
      - "5173:5173"
    volumes:
      - ./ui/client-portal:/app
      - /app/node_modules
    environment:
      - VITE_API_BASE=${VITE_API_BASE:-http://localhost:8000}
    depends_on:
      - api-gateway
    restart: always


volumes:
  pgdata: